[project]
name = "offixed-navigation"
version = "0.1.0"
description = "Human-confirmed Day-1 route replay"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1", "google-genai>=1.0,<2", "pillow>=11,<13",
  "edge-tts>=7,<8", "python-dotenv>=1,<2", "httpx>=0.28,<1",
]

[project.optional-dependencies]
teach = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["navigation"]
